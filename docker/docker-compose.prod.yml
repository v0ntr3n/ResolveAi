version: '3.8'

# Production overrides for docker-compose.yml
services:
  backend:
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      - LOG_LEVEL=INFO
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: resolveai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=resolveai
      - POSTGRES_USER=${DB_USER:-resolveai}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - resolveai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-resolveai}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
