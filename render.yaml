services:
  - type: web
    name: resolveai-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DATABASE_URL
        value: sqlite:///./data/orders.db
      - key: VECTOR_INDEX_DIR
        value: ./data/vector_index
      - key: AUTO_SEED_DATA
        value: "true"
      - key: REFUND_APPROVAL_THRESHOLD
        value: "50.0"

  - type: web
    name: resolveai-frontend
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd ui-nextjs && npm install && npm run build
    startCommand: cd ui-nextjs && npm start
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: resolveai-api
          type: web
          property: hostport
        generateValue: true
      - key: NODE_ENV
        value: production
